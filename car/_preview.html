<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미리보기 하네스</title>
<style>
  html,body{margin:0;height:100%;background:#dfeaf4;overflow:hidden;font-family:system-ui,sans-serif}
  #stage{position:absolute;inset:0;display:grid;place-items:center}
  #frameWrap{transform-origin:center center;box-shadow:0 18px 50px -20px rgba(10,40,70,.45);border-radius:18px;overflow:hidden;background:#fff}
  iframe{border:0;display:block;background:#eefaff}
  #label{position:fixed;left:10px;top:8px;font-size:12px;font-weight:700;color:#4a6c88;background:#fff8;padding:4px 8px;border-radius:8px}
</style>
</head>
<body>
<div id="label"></div>
<div id="stage"><div id="frameWrap"><iframe id="fr"></iframe></div></div>
<script>
  var q = new URLSearchParams(location.search);
  var sizes = {land:[1194,834], port:[834,1194], phone:[390,844], desk:[1440,900], ipad:[820,1180]};
  var key = q.get('size') || 'land';
  var wh = sizes[key] || sizes.land;
  var w = wh[0], h = wh[1];
  var fr = document.getElementById('fr');
  var wrap = document.getElementById('frameWrap');
  document.getElementById('label').textContent = key + ' ' + w + 'x' + h + ' · mode=' + (q.get('mode') || '-');
  fr.width = w; fr.height = h;
  function fit() {
    var s = Math.min(innerWidth / w, innerHeight / h, 2);
    wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
    wrap.style.transform = 'scale(' + s + ')';
  }
  fit(); addEventListener('resize', fit);
  var clean = q.get('clean') === '1';
  if (clean) { try { fr.contentWindow.localStorage.clear(); } catch (e) {} }
  fr.src = 'index.html' + (clean ? '?c=' + Date.now() : '');
  fr.addEventListener('load', function () {
    var doc, win, sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    doc = fr.contentDocument; win = fr.contentWindow;
    var mode = q.get('mode') || '';
    (async function () {
      if (mode === 'parent') {
        var b = doc.getElementById('lockBtn');
        var o = { bubbles: true, cancelable: true, pointerId: 1, pointerType: 'touch', isPrimary: true, button: 0 };
        b.dispatchEvent(new win.PointerEvent('pointerdown', o));
        await sleep(1750);
        b.dispatchEvent(new win.PointerEvent('pointerup', o));
        await sleep(400);
        return;
      }
      var n = parseInt(q.get('n') || '0', 10) || 0;
      for (var i = 0; i < n; i++) {
        var s = doc.querySelector('.slot[data-i="' + i + '"]');
        if (s) s.click();
        await sleep(35);
      }
      await sleep(1200);
      var sel = q.get('pick');
      if (sel !== null) {
        var p = doc.querySelector('.pick[data-s="' + sel + '"]');
        if (p) p.click();
      }
      if (q.get('modal') === 'mid') { doc.getElementById('previewMidReward') && 0; }
    })();
  });
</script>
</body>
</html>
